<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis 出行数据发送器</title><style>
*{box-sizing:border-box}body{margin:0;background:#171719;color:#fff;font:16px system-ui;display:grid;justify-items:center;padding:24px;gap:18px}h1{font-size:22px;margin:0}.watch{width:min(466px,90vw);aspect-ratio:1;background:#000;border:2px solid #444;border-radius:50%;position:relative;overflow:hidden;text-align:center}.status{position:absolute;top:13%;width:100%;color:#aaa;font-size:14px}.main{position:absolute;top:27%;width:100%}.value{font-size:clamp(52px,16vw,88px);font-weight:600;line-height:1.2}.sub{color:#aaa;margin:8px}.heading{font-size:26px}.bottom{position:absolute;bottom:17%;width:100%;font-size:14px;color:#aaa}.controls{max-width:560px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}button{background:#29292c;color:white;border:1px solid #666;border-radius:9px;padding:12px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.5}button[aria-pressed=true]{border-color:#d1283a;color:#ff8993}p{max-width:560px;color:#bbb;line-height:1.6;margin:0}a{color:#ddd}.error{color:#ff8993}
</style><h1>Jarvis 出行 · 数据发送器</h1><div class="watch"><div class="status" id="status">圆屏未连接</div><div class="main"><div class="value" id="value">--</div><div class="sub">km/h</div><div class="heading" id="heading">航向 --</div></div><div class="bottom" id="bottom">等待数据</div></div><div class="controls"><button id="gps">使用手机定位</button><button id="demo">启动模拟</button><button id="connect">连接 Jarvis</button><button id="stop">停止定位</button></div><p id="message">手机在浏览器中取得 GPS 数据，再经加密 BLE 发给设备。位置只保留在当前页面内。模拟模式会明确标记，不是实际定位或路线导航。</p><p>BLE 扫描需要支持 Web Bluetooth 的浏览器和安全网页（HTTPS，或本机 localhost）。iPhone Safari 不提供本页所需的 Web Bluetooth 接口。</p><script>
'use strict';
const SERVICE='7f3a9001-2c91-4f8a-9d2e-51c034cd1300',WRITE='7f3a9002-2c91-4f8a-9d2e-51c034cd1300';
const el=id=>document.getElementById(id);let source='none',sample=null,geoWatch=null,device=null,characteristic=null,sendTimer=null,demoTimer=null,seq=0,session=0,writing=false,origin=0;
const finite=(n,min,max)=>typeof n==='number'&&Number.isFinite(n)&&n>=min&&n<=max;
function state(){const age=sample?Date.now()-sample.time:Infinity;const fresh=age>=0&&age<=5000;el('status').textContent=characteristic?(source==='demo'?'已连接 · 模拟数据':fresh?'已连接 · 手机定位':'已连接 · 等待定位'):'圆屏未连接';el('status').className='status'+(characteristic&&source==='none'?' error':'');el('value').textContent=fresh&&sample.speed!==null?(sample.speed*3.6).toFixed(1):'--';el('heading').textContent=fresh&&sample.speed!==null&&sample.speed>=1.5&&sample.heading!==null?'航向 '+Math.round(sample.heading)+'°':'航向 --';el('bottom').textContent=source==='demo'?'模拟数据 · 勿用于出行':fresh?'定位精度 '+(sample.accuracy===null?'未知':'±'+Math.round(sample.accuracy)+' m'):'等待有效数据'}
function stopSource(){if(geoWatch!==null)navigator.geolocation.clearWatch(geoWatch);if(demoTimer!==null)clearInterval(demoTimer);demoTimer=null;geoWatch=null;source='none';sample=null;state()}
function acceptPosition(p){const c=p.coords;sample={speed:finite(c.speed,0,150)?c.speed:null,heading:finite(c.heading,0,360)?c.heading%360:null,accuracy:finite(c.accuracy,0,100000)?c.accuracy:null,time:p.timestamp};state()}
el('gps').onclick=()=>{stopSource();if(!navigator.geolocation){el('message').textContent='此浏览器不支持定位。';return}source='gps';el('message').textContent='等待位置权限和 GPS 定位。无效或过期数据不会发送。';geoWatch=navigator.geolocation.watchPosition(p=>{if(source==='gps')acceptPosition(p)},e=>{stopSource();el('message').textContent='定位不可用：'+e.message},{enableHighAccuracy:true,maximumAge:0,timeout:15000});state()};
el('demo').onclick=()=>{stopSource();source='demo';origin=Date.now();const tick=()=>{const t=(Date.now()-origin)/1000;sample={speed:8+4*Math.sin(t/4),heading:(t*7)%360,accuracy:8,time:Date.now()};state()};tick();demoTimer=setInterval(tick,500);el('message').textContent='模拟速度和航向正在更新。设备会显示“模拟数据”。'};
el('stop').onclick=()=>{stopSource();el('message').textContent='定位已停止。设备会在 5 秒内自动隐藏旧数据。'};
function makeFrame(){if(!sample||Date.now()-sample.time>5000||Date.now()<sample.time)return null;const age=Math.max(0,Math.min(5000,Date.now()-sample.time)),speedOk=finite(sample.speed,0,150),headingOk=speedOk&&sample.speed>=1.5&&finite(sample.heading,0,360),accuracyOk=finite(sample.accuracy,0,6553.4);let flags=(speedOk?1:0)|(headingOk?2:0)|(accuracyOk?4:0)|(source==='demo'?16:0);const b=new ArrayBuffer(20),v=new DataView(b);v.setUint8(0,1);v.setUint8(1,flags);v.setUint16(2,seq++&65535,true);v.setUint32(4,session,true);v.setUint16(8,speedOk?Math.round(sample.speed*100):65535,true);v.setUint16(10,headingOk?Math.round(sample.heading*100)%36000:65535,true);v.setUint16(12,accuracyOk?Math.round(sample.accuracy*10):65535,true);v.setUint16(14,Math.round(age),true);return b}
async function send(){if(!characteristic||writing)return;const frame=makeFrame();if(!frame)return;writing=true;try{await characteristic.writeValueWithResponse(frame)}catch(e){el('message').textContent='BLE 写入失败：'+e.message+'。请重新连接。';await disconnect()}finally{writing=false}}
function onDisconnected(){characteristic=null;device=null;clearInterval(sendTimer);sendTimer=null;el('connect').textContent='连接 Jarvis';state()}
async function disconnect(){clearInterval(sendTimer);sendTimer=null;if(device&&device.gatt&&device.gatt.connected)device.gatt.disconnect();onDisconnected()}
el('connect').onclick=async()=>{if(characteristic){await disconnect();return}if(!navigator.bluetooth){el('message').textContent='此浏览器不支持 Web Bluetooth；可在 Android Chrome 的 HTTPS 页面中尝试。';return}try{device=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}],optionalServices:[SERVICE]});device.addEventListener('gattserverdisconnected',onDisconnected);const server=await device.gatt.connect(),service=await server.getPrimaryService(SERVICE);characteristic=await service.getCharacteristic(WRITE);const bytes=new Uint8Array(4);crypto.getRandomValues(bytes);session=new DataView(bytes.buffer).getUint32(0,true)||1;seq=0;el('connect').textContent='断开 Jarvis';el('message').textContent='BLE 已连接。数据以加密写入发送；没有实时定位时设备会自动过期清除。';clearInterval(sendTimer);sendTimer=setInterval(send,500);await send();state()}catch(e){characteristic=null;device=null;el('message').textContent='连接未完成：'+e.message;state()}};
setInterval(state,500);state();
</script></html>
