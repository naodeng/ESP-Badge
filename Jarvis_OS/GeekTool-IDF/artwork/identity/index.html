<section class="notes" aria-label="设计说明"><div><h3>开机专用反应堆图标</h3><p>黑色 AMOLED 背景上使用青蓝点阵画出圆形能量环、分区面板与倒三角核心。关于页保留原有 JARVIS 点阵标志。</p></div><div><h3>开机动效节奏</h3><p>能量环顺时针形成，面板和中心核心逐层点亮；系统名随后淡入。动画至少4秒，设备初始化与核心自检通过后进入表盘。</p><div class="motion-beats"><span><b>0.10s</b> 外环扫描开始</span><span><b>0.22s</b> 面板矩阵亮起</span><span><b>1.82s</b> 系统名浮现</span><span><b>4.00s+</b> 自检后放行</span></div></div></section>

<script>
(() => {
  const svg = document.querySelector('#boot-surface > svg');
  const play = document.querySelector('#play');
  const scrub = document.querySelector('#scrub');
  const time = document.querySelector('#time');
  const status = document.querySelector('#status');
  const duration = 4;
  let running = false;
  let frame = 0;
  svg.pauseAnimations();
  svg.setCurrentTime(0);
  function showTime(position) {
    scrub.value = Math.round(position * 1000);
    time.value = position.toFixed(2) + ' / 4.00';
  }
  function update() {
    const position = Math.min(duration, svg.getCurrentTime());
    showTime(position);
    if (running && position >= duration) {
      svg.pauseAnimations(); svg.setCurrentTime(duration); running = false;
      play.textContent = '播放'; status.textContent = '动画完成 · 标志定格';
    }
    if (running) frame = requestAnimationFrame(update);
  }
  function pause() {
    svg.pauseAnimations(); running = false; cancelAnimationFrame(frame);
    play.textContent = '播放'; status.textContent = '已暂停'; update();
  }
  function start() {
    if (svg.getCurrentTime() >= duration) svg.setCurrentTime(0);
    cancelAnimationFrame(frame); running = true; svg.unpauseAnimations();
    play.textContent = '暂停'; status.textContent = '播放中'; update();
  }
  function seek(seconds) {
    const position = Math.max(0, Math.min(duration, seconds));
    pause(); svg.setCurrentTime(position); showTime(position);
  }
  play.addEventListener('click', () => running ? pause() : start());
  document.querySelector('#replay').addEventListener('click', () => {seek(0); start();});
  scrub.addEventListener('input', () => seek(Number(scrub.value) / 1000));
  document.querySelector('#theme-toggle').addEventListener('click', event => {
    const light = document.querySelector('#logo-surface').classList.toggle('light');
    event.currentTarget.setAttribute('aria-pressed', String(light));
    event.currentTarget.textContent = light ? '黑底预览' : '浅底预览';
  });
  document.querySelector('#language-toggle').addEventListener('click', event => {
    const english = document.querySelector('#about-surface').classList.toggle('is-english');
    event.currentTarget.setAttribute('aria-pressed', String(english));
    event.currentTarget.textContent = english ? '中文' : 'English';
  });
  const params = new URLSearchParams(location.search);
  const surface = params.get('surface');
  if (['about', 'boot', 'logo'].includes(surface)) {
    document.body.classList.add('native');
    document.querySelector('#' + surface + '-figure').classList.add('native-target');
    if (surface === 'logo') document.body.classList.add('logo-native');
  }
  if (params.get('lang') === 'en') document.querySelector('#language-toggle').click();
  const requestedTime = Number(params.get('t'));
  if (params.has('t') && Number.isFinite(requestedTime)) seek(requestedTime);
  else {seek(duration); status.textContent = '点击播放查看动画';}
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    seek(duration); status.textContent = '已按系统偏好显示静态标志；可手动播放';
  }
  document.addEventListener('visibilitychange', () => {if (document.hidden && running) pause();});
  window.addEventListener('pagehide', pause);
  // Deterministic review/export hook; it only controls this local SVG timeline.
  window.identityPreview = {seek, start, pause, svg, get running() {return running;}};
})();
</script>
